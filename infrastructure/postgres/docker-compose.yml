# Local-only PostgreSQL for the L0 walking skeleton. Not for production.
# Start:  docker compose -f infrastructure/postgres/docker-compose.yml up -d
# Stop:   docker compose -f infrastructure/postgres/docker-compose.yml down
# Wipe:   docker compose -f infrastructure/postgres/docker-compose.yml down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fsie_l0_postgres
    environment:
      POSTGRES_USER: fsie
      POSTGRES_PASSWORD: fsie
      POSTGRES_DB: fsie_l0
    ports:
      - "5432:5432"
    volumes:
      - fsie_l0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsie -d fsie_l0"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fsie_l0_pgdata:
