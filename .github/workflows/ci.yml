name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run offline test suite
        run: python -m pytest -m "not integration"

      - name: Validate FSIE knowledge package
        run: python scripts/validate_fsie_package.py

  migrations:
    name: Fresh-database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fsie
          POSTGRES_PASSWORD: fsie
          POSTGRES_DB: fsie_l0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsie -d fsie_l0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      FSIE_RUN_INTEGRATION: "1"
      FSIE_DATABASE_URL: postgresql+psycopg://fsie:fsie@localhost:5432/fsie_l0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Upgrade, downgrade and re-upgrade an empty database
        run: python -m pytest -m integration tests/persistence/test_live_migrations.py
