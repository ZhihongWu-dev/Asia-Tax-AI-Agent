[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asia-tax-agent"
version = "0.1.0"
description = "East Asia tax AI agent — Hong Kong FSIE L0 research prototype (walking skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1",
    "truststore>=0.10; sys_platform == 'darwin'",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "beautifulsoup4>=4.12",
    "pypdf>=4",
    "reportlab>=4.2,<5",
    "Pillow==11.3.0",
    "rapidocr-onnxruntime==1.4.4",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "cryptography>=42",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require a live PostgreSQL reachable via FSIE_DATABASE_URL",
]
